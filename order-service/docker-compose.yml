version: '3.8'

services:
  orderdb:
    image: postgres:16-alpine
    container_name: oms-orderdb
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: oms_user
      POSTGRES_PASSWORD: oms_pass
    ports:
      - "5433:5432"
    volumes:
      - orderdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms_user -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orderdb-data: